<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HPF Admin Manage</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#0b0f0c; --card:#121a14; --line:#1e2a22; --text:#e8f0ea;
      --muted:#8fa396; --accent:#c8f54a; --input:#0e1511; --danger:#e85d5d;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:radial-gradient(1200px 600px at 50% -10%,#16301c 0%,var(--bg) 55%);
    }
    .wrap{max-width:920px;margin:0 auto;padding:20px 12px 40px}
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      object-fit: cover;
      display: block;
      margin: 0 auto 12px;
      border: 2px solid var(--accent);
      background: #0e1511;
    }
    .pill{text-align:center;color:var(--accent);font-size:12px;letter-spacing:.12em;font-weight:700;margin:0 0 6px}
    h1{text-align:center;margin:0 0 6px;font-size:24px}
    .sub{text-align:center;color:var(--muted);margin:0 0 16px;font-size:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
    label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
    input,select{
      width:100%;background:var(--input);border:1px solid var(--line);border-radius:10px;
      padding:11px 12px;color:var(--text);font-size:15px;outline:none
    }
    button{
      border:0;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700;cursor:pointer
    }
    .primary{background:var(--accent);color:#111;width:100%;margin-top:12px}
    .ghost{background:transparent;color:var(--muted)}
    .danger{background:#3a1515;color:#ffb4b4;border:1px solid #5c2424}
    .row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .row-btns button{flex:1;min-width:90px}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
    .tab{background:#0e1511;color:var(--muted);border:1px solid var(--line);padding:10px 6px}
    .tab.active{background:#1a2a1e;color:var(--accent);border-color:#2f4a36}
    .item{
      border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#0e1511
    }
    .item h3{margin:0 0 6px;font-size:15px}
    .meta{color:var(--muted);font-size:12px;margin-bottom:6px}
    .error,.ok{display:none;margin-top:10px;border-radius:10px;padding:10px;font-size:14px}
    .error{background:#3a1515;color:#ffb4b4;border:1px solid #5c2424}
    .ok{background:#14301a;color:#b7f5c2;border:1px solid #2a5a36}
    .error.show,.ok.show{display:block}
    .hidden{display:none!important}
    .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
    @media(max-width:560px){.tabs{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loginView">
      <img class="logo" src="./hpf-logo.jpg" alt="HPF Logo" />
      <p class="pill">HPF ADMIN</p>
      <h1>Manage</h1>
      <p class="sub">Edit / delete tribes, hostels, executives, reports</p>
      <div class="card">
        <label>Email</label>
        <input id="email" type="email" />
        <label>Password</label>
        <input id="password" type="password" />
        <button class="primary" id="loginBtn" type="button">Sign in</button>
        <div class="error" id="loginError"></div>
      </div>
    </div>

    <div id="appView" class="hidden">
      <img class="logo" src="./hpf-logo.jpg" alt="HPF Logo" />
      <p class="pill">HPF ADMIN</p>
      <div class="top">
        <h1 style="margin:0;font-size:22px;text-align:left">Manage</h1>
        <button class="ghost" id="logoutBtn" type="button">Sign out</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="tribes" type="button">Tribes</button>
        <button class="tab" data-tab="hostels" type="button">Hostels</button>
        <button class="tab" data-tab="executives" type="button">Executives</button>
        <button class="tab" data-tab="reports" type="button">Reports</button>
      </div>

      <div class="error" id="msgError"></div>
      <div class="ok" id="msgOk"></div>

      <div id="panel-tribes"></div>
      <div id="panel-hostels" class="hidden"></div>
      <div id="panel-executives" class="hidden"></div>
      <div id="panel-reports" class="hidden"></div>
    </div>
  </div>
  <script>
    var SUPABASE_URL = "https://pexepaclinlqcwjuzhen.supabase.co";
    var SUPABASE_KEY = "sb_publishable_U7WdBF49bn0x0cJ8t3s2WQ_5w4mnty5";
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var loginView = document.getElementById("loginView");
    var appView = document.getElementById("appView");
    var loginError = document.getElementById("loginError");
    var msgError = document.getElementById("msgError");
    var msgOk = document.getElementById("msgOk");

    var tribes = [];
    var hostels = [];
    var executives = [];
    var reports = [];

    function show(el, msg) {
      el.textContent = msg || "";
      if (msg) el.classList.add("show"); else el.classList.remove("show");
    }
    function clearMsg() { show(msgError, ""); show(msgOk, ""); }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function requireAdmin(uid) {
      return sb.from("admin_accounts").select("id").eq("id", uid).maybeSingle()
        .then(function(res) {
          if (res.error) throw res.error;
          return !!res.data;
        });
    }
    function tribeName(id) {
      for (var i = 0; i < tribes.length; i++) if (tribes[i].id === id) return tribes[i].name;
      return "—";
    }
    function loadAll() {
      clearMsg();
      return Promise.all([
        sb.from("tribes").select("*").order("name"),
        sb.from("hostels").select("*").order("name"),
        sb.from("executive_accounts").select("*").order("full_name"),
        sb.from("weekly_reports").select("*").order("created_at", { ascending: false })
      ]).then(function(results) {
        if (results[0].error) throw results[0].error;
        if (results[1].error) throw results[1].error;
        if (results[2].error) throw results[2].error;
        if (results[3].error) throw results[3].error;
        tribes = results[0].data || [];
        hostels = results[1].data || [];
        executives = results[2].data || [];
        reports = results[3].data || [];
        renderTribes();
        renderHostels();
        renderExecutives();
        renderReports();
      });
    }

    function renderTribes() {
      var el = document.getElementById("panel-tribes");
      var html = '<div class="card"><h3 style="margin:0 0 8px">Add tribe</h3>' +
        '<label>Name</label><input id="newTribeName" placeholder="Tribe name" />' +
        '<label>Registration code</label><input id="newTribeCode" placeholder="Code for executives" />' +
        '<button class="primary" id="addTribeBtn" type="button">Add tribe</button></div>';
      for (var i = 0; i < tribes.length; i++) {
        var t = tribes[i];
        html += '<div class="item" data-id="' + t.id + '"><h3>' + esc(t.name) + '</h3>' +
          '<div class="meta">Code: ' + esc(t.registration_code || "—") + '</div>' +
          '<label>Name</label><input class="t-name" value="' + esc(t.name) + '" />' +
          '<label>Registration code</label><input class="t-code" value="' + esc(t.registration_code || "") + '" />' +
          '<div class="row-btns"><button class="primary save-tribe" type="button">Save</button>' +
          '<button class="danger del-tribe" type="button">Delete</button></div></div>';
      }
      if (!tribes.length) html += '<p class="meta">No tribes yet.</p>';
      el.innerHTML = html;

      document.getElementById("addTribeBtn").onclick = function() {
        clearMsg();
        var name = document.getElementById("newTribeName").value.trim();
        var code = document.getElementById("newTribeCode").value.trim();
        if (!name || !code) return show(msgError, "Enter tribe name and code.");
        sb.from("tribes").insert({ name: name, registration_code: code }).then(function(res) {
          if (res.error) return show(msgError, res.error.message);
          show(msgOk, "Tribe added.");
          return loadAll();
        });
      };
      var items = el.querySelectorAll(".item");
      for (var j = 0; j < items.length; j++) {
        (function(item) {
          var id = item.getAttribute("data-id");
          item.querySelector(".save-tribe").onclick = function() {
            clearMsg();
            var name = item.querySelector(".t-name").value.trim();
            var code = item.querySelector(".t-code").value.trim();
            if (!name) return show(msgError, "Name required.");
            sb.from("tribes").update({ name: name, registration_code: code }).eq("id", id).then(function(res) {
              if (res.error) return show(msgError, res.error.message);
              show(msgOk, "Tribe updated.");
              return loadAll();
            });
          };
          item.querySelector(".del-tribe").onclick = function() {
            if (!confirm("Delete this tribe?")) return;
            clearMsg();
            sb.from("tribes").delete().eq("id", id).then(function(res) {
              if (res.error) return show(msgError, res.error.message);
              show(msgOk, "Tribe deleted.");
              return loadAll();
            });
          };
        })(items[j]);
      }
    }

    function renderHostels() {
      var el = document.getElementById("panel-hostels");
      var tribeOptions = "";
      for (var i = 0; i < tribes.length; i++) {
        tribeOptions += '<option value="' + tribes[i].id + '">' + esc(tribes[i].name) + "</option>";
      }
      var html = '<div class="card"><h3 style="margin:0 0 8px">Add hostel</h3>' +
        '<label>Name</label><input id="newHostelName" placeholder="Hostel name" />' +
        '<label>Tribe</label><select id="newHostelTribe">' + tribeOptions + '</select>' +
        '<button class="primary" id="addHostelBtn" type="button">Add hostel</button></div>';
      for (var h = 0; h < hostels.length; h++) {
        var ho = hostels[h];
        var opts = "";
        for (var t = 0; t < tribes.length; t++) {
          var sel = tribes[t].id === ho.tribe_id ? " selected" : "";
          opts += '<option value="' + tribes[t].id + '"' + sel + '>' + esc(tribes[t].name) + '</option>';
        }
        html += '<div class="item" data-id="' + ho.id + '"><h3>' + esc(ho.name) + '</h3>' +
          '<div class="meta">Tribe: ' + esc(tribeName(ho.tribe_id)) + '</div>' +
          '<label>Name</label><input class="h-name" value="' + esc(ho.name) + '" />' +
          '<label>Tribe</label><select class="h-tribe">' + opts + '</select>' +
          '<div class="row-btns"><button class="primary save-hostel" type="button">Save</button>' +
          '<button class="danger del-hostel" type="button">Delete</button></div></div>';
      }
      if (!hostels.length) html += '<p class="meta">No hostels yet.</p>';
      el.innerHTML = html;

      document.getElementById("addHostelBtn").onclick = function() {
        clearMsg();
        var name = document.getElementById("newHostelName").value.trim();
        var tribe_id = document.getElementById("newHostelTribe").value;
        if (!name || !tribe_id) return show(msgError, "Enter hostel name and tribe.");
        sb.from("hostels").insert({ name: name, tribe_id: tribe_id }).then(function(res) {
          if (res.error) return show(msgError, res.error.message);
          show(msgOk, "Hostel added.");
          return loadAll();
        });
      };
      var items = el.querySelectorAll(".item");
      for (var j = 0; j < items.length; j++) {
        (function(item) {
          var id = item.getAttribute("data-id");
          item.querySelector(".save-hostel").onclick = function() {
            clearMsg();
            var name = item.querySelector(".h-name").value.trim();
            var tribe_id = item.querySelector(".h-tribe").value;
            if (!name) return show(msgError, "Name required.");
            sb.from("hostels").update({ name: name, tribe_id: tribe_id }).eq("id", id).then(function(res) {
              if (res.error) return show(msgError, res.error.message);
              show(msgOk, "Hostel updated.");
              return loadAll();
            });
          };
          item.querySelector(".del-hostel").onclick = function() {
            if (!confirm("Delete this hostel?")) return;
            clearMsg();
            sb.from("hostels").delete().eq("id", id).then(function(res) {
              if (res.error) return show(msgError, res.error.message);
              show(msgOk, "Hostel deleted.");
              return loadAll();
            });
          };
        })(items[j]);
      }
    }function renderExecutives() {
      var el = document.getElementById("panel-executives");
      var html = "";
      for (var i = 0; i < executives.length; i++) {
        var ex = executives[i];
        var opts = '<option value="">No tribe</option>';
        for (var t = 0; t < tribes.length; t++) {
          var sel = tribes[t].id === ex.tribe_id ? " selected" : "";
          opts += '<option value="' + tribes[t].id + '"' + sel + '>' + esc(tribes[t].name) + '</option>';
        }
        html += '<div class="item" data-id="' + ex.id + '"><h3>' + esc(ex.full_name || ex.email || "—") + '</h3>' +
          '<div class="meta">' + esc(ex.email || "") + ' · ' + esc(tribeName(ex.tribe_id)) + '</div>' +
          '<label>Full name</label><input class="e-name" value="' + esc(ex.full_name || "") + '" />' +
          '<label>Tribe</label><select class="e-tribe">' + opts + '</select>' +
          '<div class="row-btns"><button class="primary save-exec" type="button">Save</button>' +
          '<button class="danger del-exec" type="button">Delete</button></div></div>';
      }
      if (!executives.length) html = '<p class="meta">No executives yet.</p>';
      el.innerHTML = html;

      var items = el.querySelectorAll(".item");
      for (var j = 0; j < items.length; j++) {
        (function(item) {
          var id = item.getAttribute("data-id");
          item.querySelector(".save-exec").onclick = function() {
            clearMsg();
            var full_name = item.querySelector(".e-name").value.trim();
            var tribe_id = item.querySelector(".e-tribe").value || null;
            sb.from("executive_accounts").update({ full_name: full_name, tribe_id: tribe_id }).eq("id", id).then(function(res) {
              if (res.error) return show(msgError, res.error.message);
              show(msgOk, "Executive updated.");
              return loadAll();
            });
          };
          item.querySelector(".del-exec").onclick = function() {
            if (!confirm("Delete this executive account row?")) return;
            clearMsg();
            sb.from("executive_accounts").delete().eq("id", id).then(function(res) {
              if (res.error) return show(msgError, res.error.message);
              show(msgOk, "Executive deleted.");
              return loadAll();
            });
          };
        })(items[j]);
      }
    }

    function renderReports() {
      var el = document.getElementById("panel-reports");
      var html = "";
      for (var i = 0; i < reports.length; i++) {
        var r = reports[i];
        html += '<div class="item" data-id="' + r.id + '"><h3>' + esc(r.title || "Untitled") + '</h3>' +
          '<div class="meta">Week ' + (r.week_number == null ? "—" : r.week_number) + ' · ' + esc(tribeName(r.tribe_id)) +
          ' · Att ' + (r.attendance == null ? "—" : r.attendance) + '</div>' +
          '<label>Title</label><input class="r-title" value="' + esc(r.title || "") + '" />' +
          '<label>Duration</label><input class="r-duration" value="' + esc(r.duration || "") + '" />' +
          '<label>Attendance</label><input class="r-att" type="number" value="' + (r.attendance == null ? "" : r.attendance) + '" />' +
          '<label>Comment</label><input class="r-comment" value="' + esc(r.comment || r.content || "") + '" />' +
          '<div class="row-btns"><button class="primary save-report" type="button">Save</button>' +
          '<button class="danger del-report" type="button">Delete</button></div></div>';
      }
      if (!reports.length) html = '<p class="meta">No reports yet.</p>';
      el.innerHTML = html;

      var items = el.querySelectorAll(".item");
      for (var j = 0; j < items.length; j++) {
        (function(item) {
          var id = item.getAttribute("data-id");
          item.querySelector(".save-report").onclick = function() {
            clearMsg();
            var title = item.querySelector(".r-title").value.trim();
            var duration = item.querySelector(".r-duration").value.trim();
            var attendance = item.querySelector(".r-att").value;
            var comment = item.querySelector(".r-comment").value.trim();
            var payload = { title: title, duration: duration, comment: comment };
            if (attendance !== "") payload.attendance = Number(attendance);
            sb.from("weekly_reports").update(payload).eq("id", id).then(function(res) {
              if (res.error) return show(msgError, res.error.message);
              show(msgOk, "Report updated.");
              return loadAll();
            });
          };
          item.querySelector(".del-report").onclick = function() {
            if (!confirm("Delete this report?")) return;
            clearMsg();
            sb.from("weekly_reports").delete().eq("id", id).then(function(res) {
              if (res.error) return show(msgError, res.error.message);
              show(msgOk, "Report deleted.");
              return loadAll();
            });
          };
        })(items[j]);
      }
    }

    document.querySelectorAll(".tab").forEach(function(btn) {
      btn.onclick = function() {
        document.querySelectorAll(".tab").forEach(function(b) { b.classList.remove("active"); });
        btn.classList.add("active");
        var tab = btn.getAttribute("data-tab");
        document.getElementById("panel-tribes").classList.toggle("hidden", tab !== "tribes");
        document.getElementById("panel-hostels").classList.toggle("hidden", tab !== "hostels");
        document.getElementById("panel-executives").classList.toggle("hidden", tab !== "executives");
        document.getElementById("panel-reports").classList.toggle("hidden", tab !== "reports");
      };
    });

    document.getElementById("loginBtn").onclick = function() {
      show(loginError, "");
      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value;
      sb.auth.signInWithPassword({ email: email, password: password }).then(function(res) {
        if (res.error) throw res.error;
        return requireAdmin(res.data.user.id).then(function(ok) {
          if (!ok) {
            return sb.auth.signOut().then(function() {
              throw new Error("This account is not an HPF Admin.");
            });
          }
          loginView.classList.add("hidden");
          appView.classList.remove("hidden");
          return loadAll();
        });
      }).catch(function(err) {
        show(loginError, err.message || String(err));
      });
    };

    document.getElementById("logoutBtn").onclick = function() {
      sb.auth.signOut().then(function() {
        appView.classList.add("hidden");
        loginView.classList.remove("hidden");
      });
    };

    sb.auth.getSession().then(function(res) {
      if (!res.data.session) return;
      requireAdmin(res.data.session.user.id).then(function(ok) {
        if (!ok) return;
        loginView.classList.add("hidden");
        appView.classList.remove("hidden");
        loadAll().catch(function(e) { show(msgError, e.message || String(e)); });
      });
    });
  </script>
</body>
</html>
