<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HPF Admin Export</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root {
      --bg:#0b0f0c; --card:#121a14; --line:#1e2a22; --text:#e8f0ea;
      --muted:#8fa396; --accent:#c8f54a; --input:#0e1511;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:radial-gradient(1200px 600px at 50% -10%,#16301c 0%,var(--bg) 55%);
    }
    .wrap{max-width:900px;margin:0 auto;padding:20px 12px 40px}
    .logo{
      width:56px;height:56px;border-radius:14px;object-fit:cover;display:block;
      margin:0 auto 12px;border:2px solid var(--accent);background:#0e1511;
    }
    .pill{text-align:center;color:var(--accent);font-size:12px;letter-spacing:.12em;font-weight:700;margin:0 0 6px}
    h1{text-align:center;margin:0 0 6px;font-size:24px}
    .sub{text-align:center;color:var(--muted);margin:0 0 16px;font-size:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
    label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
    input,select{
      width:100%;background:var(--input);border:1px solid var(--line);border-radius:10px;
      padding:11px 12px;color:var(--text);font-size:15px;outline:none
    }
    button{border:0;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer}
    .primary{background:var(--accent);color:#111;width:100%;margin-top:10px}
    .ghost{background:transparent;color:var(--muted)}
    .row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .row-btns button{flex:1;min-width:120px}
    .error,.ok{display:none;margin-top:10px;border-radius:10px;padding:10px;font-size:14px}
    .error{background:#3a1515;color:#ffb4b4;border:1px solid #5c2424}
    .ok{background:#14301a;color:#b7f5c2;border:1px solid #2a5a36}
    .error.show,.ok.show{display:block}
    .hidden{display:none!important}
    .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
    .top h1{margin:0;font-size:22px;text-align:left}
    .meta{color:var(--muted);font-size:12px;margin-top:4px}
    .item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:#0e1511}
    .item b{color:var(--accent)}
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loginView">
      <img class="logo" src="./hpf-logo.jpg" alt="HPF Logo" />
      <p class="pill">HPF ADMIN</p>
      <h1>Export Reports</h1>
      <p class="sub">Download by semester, month, tribe, or hostel</p>
      <div class="card">
        <label>Email</label>
        <input id="email" type="email" />
        <label>Password</label>
        <input id="password" type="password" />
        <button class="primary" id="loginBtn" type="button">Sign in</button>
        <div class="error" id="loginError"></div>
      </div>
    </div>

    <div id="appView" class="hidden">
      <img class="logo" src="./hpf-logo.jpg" alt="HPF Logo" />
      <p class="pill">HPF ADMIN</p>
      <div class="top">
        <h1>Export</h1>
        <button class="ghost" id="logoutBtn" type="button">Sign out</button>
      </div>
      <div class="card">
        <label>Semester</label>
        <select id="semesterFilter"><option value="">All semesters</option></select>
        <label>Month (optional)</label>
        <input id="monthFilter" type="month" />
        <label>Tribe (optional)</label>
        <select id="tribeFilter"><option value="">All tribes</option></select>
        <label>Hostel (optional)</label>
        <select id="hostelFilter"><option value="">All hostels</option></select>
        <div class="row-btns">
          <button class="primary" id="pdfBtn" type="button" style="margin-top:0">Download PDF</button>
          <button class="primary" id="csvBtn" type="button" style="margin-top:0">Download Excel/CSV</button>
        </div>
        <div class="error" id="msgError"></div>
        <div class="ok" id="msgOk"></div>
        <p class="meta" id="countBox" style="margin-top:12px">Loading...</p>
      </div>
      <div class="card">
        <div class="meta" style="margin-bottom:8px">Preview (latest 15 of filtered)</div>
        <div id="preview"></div>
      </div>
      <p class="sub"><a href="./portal.html" style="color:#c8f54a">Back to Portal</a> · <a href="./admin-semesters.html" style="color:#c8f54a">Semesters</a></p>
    </div>
  </div>
  <script>
    var SUPABASE_URL = "https://pexepaclinlqcwjuzhen.supabase.co";
    var SUPABASE_KEY = "sb_publishable_U7WdBF49bn0x0cJ8t3s2WQ_5w4mnty5";
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var loginView = document.getElementById("loginView");
    var appView = document.getElementById("appView");
    var loginError = document.getElementById("loginError");
    var msgError = document.getElementById("msgError");
    var msgOk = document.getElementById("msgOk");

    var tribes = [], hostels = [], execs = [], reports = [], semesters = [];
    var tribeMap = {}, hostelMap = {}, execMap = {}, semesterMap = {};

    function show(el, msg) {
      el.textContent = msg || "";
      if (msg) el.classList.add("show"); else el.classList.remove("show");
    }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function ym(dateStr) {
      if (!dateStr) return "";
      return String(dateStr).slice(0, 7);
    }
    function tribeName(id) { return tribeMap[id] || "—"; }
    function hostelName(id) { return hostelMap[id] || "—"; }
    function execName(id) { return execMap[id] || "—"; }
    function semesterName(id) { return semesterMap[id] || "No semester"; }
    function requireAdmin(uid) {
      return Promise.all([
        sb.from("admin_accounts").select("id, full_name").eq("id", uid).maybeSingle(),
        sb.from("president_accounts").select("id, full_name").eq("id", uid).maybeSingle()
      ]).then(function(res) {
        if (res[0].error) throw res[0].error;
        if (res[1].error) throw res[1].error;
        if (res[0].data) return res[0].data;
        if (res[1].data) return res[1].data;
        return null;
      });
    }
    function filtered() {
      var sem = document.getElementById("semesterFilter").value || "";
      var month = document.getElementById("monthFilter").value || "";
      var tribe = document.getElementById("tribeFilter").value || "";
      var hostel = document.getElementById("hostelFilter").value || "";
      return reports.filter(function(r) {
        if (sem && String(r.semester_id) !== String(sem)) return false;
        if (month && ym(r.created_at) !== month) return false;
        if (tribe && String(r.tribe_id) !== String(tribe)) return false;
        if (hostel && String(r.hostel_id) !== String(hostel)) return false;
        return true;
      });
    }
    function filterLabel() {
      var parts = [];
      var sem = document.getElementById("semesterFilter").value || "";
      var month = document.getElementById("monthFilter").value || "";
      var tribe = document.getElementById("tribeFilter").value || "";
      var hostel = document.getElementById("hostelFilter").value || "";
      if (sem) parts.push(semesterName(sem));
      else parts.push("All semesters");
      if (month) parts.push(month);
      if (tribe) parts.push(tribeName(tribe));
      if (hostel) parts.push(hostelName(hostel));
      return parts.join(" · ");
    }
    function fileTag() {
      var sem = document.getElementById("semesterFilter").value || "";
      var month = document.getElementById("monthFilter").value || "";
      var bits = [];
      if (sem) bits.push(String(semesterName(sem)).replace(/\s+/g, "_"));
      if (month) bits.push(month);
      if (!bits.length) bits.push("all");
      return bits.join("_");
    }
    function renderPreview() {
      var rows = filtered();
      document.getElementById("countBox").textContent = rows.length + " report(s) match · " + filterLabel();
      var showRows = rows.slice(0, 15);
      if (!showRows.length) {
        document.getElementById("preview").innerHTML = '<div class="meta">No reports for this filter.</div>';
        return;
      }
      var html = "";
      for (var i = 0; i < showRows.length; i++) {
        var r = showRows[i];
        html += '<div class="item">';
        html += "<b>" + esc(r.title || "Report") + "</b>";
        html += '<div class="meta">' + esc(semesterName(r.semester_id)) +
          " · Week " + esc(r.week_number) +
          " · " + esc(hostelName(r.hostel_id)) +
          " · " + esc(tribeName(r.tribe_id)) + "</div>";
        html += '<div class="meta">' + esc(execName(r.executive_id)) +
          (r.attendance != null ? " · Attendance " + esc(r.attendance) : "") +
          (r.duration ? " · " + esc(r.duration) : "") + "</div>";
        if (r.comment || r.content) html += '<div class="meta">' + esc(r.comment || r.content) + "</div>";
        html += "</div>";
      }
      document.getElementById("preview").innerHTML = html;
    }
    function fillFilters() {
      var ss = document.getElementById("semesterFilter");
      ss.innerHTML = '<option value="">All semesters</option>';
      for (var i = 0; i < semesters.length; i++) {
        var s = semesters[i];
        var label = s.name + (s.is_active ? " (ACTIVE)" : "");
        ss.innerHTML += '<option value="' + s.id + '">' + esc(label) + "</option>";
      }
      for (var a = 0; a < semesters.length; a++) {
        if (semesters[a].is_active) {
          ss.value = semesters[a].id;
          break;
        }
      }
      var ts = document.getElementById("tribeFilter");
      ts.innerHTML = '<option value="">All tribes</option>';
      for (var t = 0; t < tribes.length; t++) {
        ts.innerHTML += '<option value="' + tribes[t].id + '">' + esc(tribes[t].name) + "</option>";
      }
      fillHostels();
    }
    function fillHostels() {
      var tribe = document.getElementById("tribeFilter").value || "";
      var hs = document.getElementById("hostelFilter");
      hs.innerHTML = '<option value="">All hostels</option>';
      for (var i = 0; i < hostels.length; i++) {
        var h = hostels[i];
        if (tribe && String(h.tribe_id) !== String(tribe)) continue;
        hs.innerHTML += '<option value="' + h.id + '">' + esc(h.name) + "</option>";
      }
    }
    function loadAll() {
      show(msgError, "");
      return Promise.all([
        sb.from("tribes").select("id, name").order("name"),
        sb.from("hostels").select("id, name, tribe_id").order("name"),
        sb.from("executive_accounts").select("id, full_name").order("full_name"),
        sb.from("weekly_reports").select("*").order("created_at", { ascending: false }),
        sb.from("semesters").select("id, name, is_active, created_at").order("created_at", { ascending: false })
      ]).then(function(results) {
        for (var i = 0; i < results.length; i++) if (results[i].error) throw results[i].error;
        tribes = results[0].data || [];
        hostels = results[1].data || [];
        execs = results[2].data || [];
        reports = results[3].data || [];
        semesters = results[4].data || [];
        tribeMap = {}; hostelMap = {}; execMap = {}; semesterMap = {};
        for (var t = 0; t < tribes.length; t++) tribeMap[tribes[t].id] = tribes[t].name;
        for (var h = 0; h < hostels.length; h++) hostelMap[hostels[h].id] = hostels[h].name;
        for (var e = 0; e < execs.length; e++) execMap[execs[e].id] = execs[e].full_name;
        for (var s = 0; s < semesters.length; s++) semesterMap[semesters[s].id] = semesters[s].name;
        fillFilters();
        renderPreview();
      });
    }function downloadCSV() {
      var rows = filtered();
      if (!rows.length) return show(msgError, "No reports to export for this filter.");
      show(msgError, ""); show(msgOk, "");
      var lines = ['"Semester","Month","Week","Title","Tribe","Hostel","Executive","Duration","Attendance","Comment","Created"'];
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var comment = String(r.comment || r.content || "").replace(/"/g, '""');
        lines.push(
          '"' + String(semesterName(r.semester_id)).replace(/"/g, '""') + '",' +
          '"' + ym(r.created_at) + '",' +
          '"' + (r.week_number == null ? "" : r.week_number) + '",' +
          '"' + String(r.title || "").replace(/"/g, '""') + '",' +
          '"' + String(tribeName(r.tribe_id)).replace(/"/g, '""') + '",' +
          '"' + String(hostelName(r.hostel_id)).replace(/"/g, '""') + '",' +
          '"' + String(execName(r.executive_id)).replace(/"/g, '""') + '",' +
          '"' + String(r.duration || "").replace(/"/g, '""') + '",' +
          '"' + (r.attendance == null ? "" : r.attendance) + '",' +
          '"' + comment + '",' +
          '"' + String(r.created_at || "") + '"'
        );
      }
      var blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "HPF-Reports-" + fileTag() + ".csv";
      a.click();
      show(msgOk, "CSV downloaded (" + rows.length + " rows).");
    }
    function downloadPDF() {
      var rows = filtered();
      if (!rows.length) return show(msgError, "No reports to export for this filter.");
      show(msgError, ""); show(msgOk, "");
      var jsPDF = window.jspdf.jsPDF;
      var doc = new jsPDF({ orientation: "landscape" });
      doc.setFontSize(14);
      doc.text("HPF Executive Reports", 14, 14);
      doc.setFontSize(10);
      doc.text("Filter: " + filterLabel(), 14, 20);
      doc.text("Generated: " + new Date().toLocaleString() + " · " + rows.length + " report(s)", 14, 26);
      var body = [];
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        body.push([
          semesterName(r.semester_id),
          String(r.week_number == null ? "" : r.week_number),
          r.title || "",
          tribeName(r.tribe_id),
          hostelName(r.hostel_id),
          execName(r.executive_id),
          r.duration || "",
          r.attendance == null ? "" : String(r.attendance),
          String(r.comment || r.content || "").slice(0, 80)
        ]);
      }
      doc.autoTable({
        startY: 30,
        head: [["Semester", "Week", "Title", "Tribe", "Hostel", "Executive", "Duration", "Att.", "Comment"]],
        body: body,
        styles: { fontSize: 7 },
        headStyles: { fillColor: [22, 48, 28] }
      });
      doc.save("HPF-Reports-" + fileTag() + ".pdf");
      show(msgOk, "PDF downloaded (" + rows.length + " rows).");
    }
    function openApp() {
      loginView.classList.add("hidden");
      appView.classList.remove("hidden");
      return loadAll();
    }

    document.getElementById("semesterFilter").onchange = renderPreview;
    document.getElementById("monthFilter").onchange = renderPreview;
    document.getElementById("tribeFilter").onchange = function() {
      fillHostels();
      renderPreview();
    };
    document.getElementById("hostelFilter").onchange = renderPreview;
    document.getElementById("pdfBtn").onclick = downloadPDF;
    document.getElementById("csvBtn").onclick = downloadCSV;

    document.getElementById("loginBtn").onclick = function() {
      show(loginError, "");
      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value;
      sb.auth.signInWithPassword({ email: email, password: password }).then(function(res) {
        if (res.error) throw res.error;
        return requireAdmin(res.data.user.id).then(function(admin) {
          if (!admin) {
            return sb.auth.signOut().then(function() {
              throw new Error("This account is not HPF Admin or President.");
            });
          }
          return openApp();
        });
      }).catch(function(err) {
        show(loginError, err.message || String(err));
      });
    };

    document.getElementById("logoutBtn").onclick = function() {
      sb.auth.signOut().then(function() {
        appView.classList.add("hidden");
        loginView.classList.remove("hidden");
      });
    };

    sb.auth.getSession().then(function(res) {
      if (!res.data.session) return;
      requireAdmin(res.data.session.user.id).then(function(admin) {
        if (!admin) return;
        openApp().catch(function(e) { show(msgError, e.message || String(e)); });
      });
    });
  </script>
</body>
</html>
