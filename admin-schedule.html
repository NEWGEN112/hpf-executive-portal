<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HPF Hostel Prayer Timetable</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#0b0f0c; --card:#121a14; --line:#1e2a22; --text:#e8f0ea;
      --muted:#8fa396; --accent:#c8f54a; --input:#0e1511;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:radial-gradient(1200px 600px at 50% -10%,#16301c 0%,var(--bg) 55%);
    }
    .wrap{max-width:960px;margin:0 auto;padding:20px 12px 40px}
    .logo{
      width:56px;height:56px;border-radius:14px;object-fit:cover;display:block;
      margin:0 auto 12px;border:2px solid var(--accent);background:#0e1511;
    }
    .pill{text-align:center;color:var(--accent);font-size:12px;letter-spacing:.12em;font-weight:700;margin:0 0 6px}
    h1{text-align:center;margin:0 0 6px;font-size:24px}
    .sub{text-align:center;color:var(--muted);margin:0 0 16px;font-size:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
    label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
    input,select,textarea{
      width:100%;background:var(--input);border:1px solid var(--line);border-radius:10px;
      padding:11px 12px;color:var(--text);font-size:15px;outline:none;font-family:inherit
    }
    button{border:0;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer}
    .primary{background:var(--accent);color:#111;width:100%;margin-top:10px}
    .ghost{background:transparent;color:var(--muted)}
    .danger{background:#3a1515;color:#ffb4b4;border:1px solid #5c2424}
    .row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .row-btns button{flex:1;min-width:90px}
    .error,.ok{display:none;margin-top:10px;border-radius:10px;padding:10px;font-size:14px}
    .error{background:#3a1515;color:#ffb4b4;border:1px solid #5c2424}
    .ok{background:#14301a;color:#b7f5c2;border:1px solid #2a5a36}
    .error.show,.ok.show{display:block}
    .hidden{display:none!important}
    .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
    .top h1{margin:0;font-size:22px;text-align:left}
    .item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:#0e1511}
    .item b{color:var(--accent)}
    .meta{color:var(--muted);font-size:12px;margin-top:4px}
    .links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .links a{color:#111;background:var(--accent);text-decoration:none;font-weight:700;padding:8px 12px;border-radius:999px;font-size:13px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:560px){.grid2{grid-template-columns:1fr}}
    .form-title{font-weight:700;margin-bottom:4px}
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loginView">
      <img class="logo" src="./hpf-logo.jpg" alt="HPF Logo" />
      <p class="pill">HPF SCHEDULE</p>
      <h1>Hostel Prayer Timetable</h1>
      <p class="sub">Days, times, hostels and coordinators</p>
      <div class="card">
        <label>Email</label>
        <input id="email" type="email" />
        <label>Password</label>
        <input id="password" type="password" />
        <button class="primary" id="loginBtn" type="button">Sign in</button>
        <div class="error" id="loginError"></div>
      </div>
    </div>

    <div id="appView" class="hidden">
      <img class="logo" src="./hpf-logo.jpg" alt="HPF Logo" />
      <p class="pill">HPF SCHEDULE</p>
      <div class="top">
        <h1>Prayer Timetable</h1>
        <button class="ghost" id="logoutBtn" type="button">Sign out</button>
      </div>
      <div class="links">
        <a href="./president.html">President Hub</a>
        <a href="./admin-dashboard.html">Dashboard</a>
        <a href="./admin-manage.html">Manage</a>
        <a href="./admin-export.html">Export</a>
      </div>

      <div class="card">
        <div class="form-title" id="formTitle">Add hostel prayer slot</div>
        <p class="meta" id="formHint">Add as many rows as you want. Same hostel can meet many days.</p>
        <input type="hidden" id="editId" value="" />
        <div class="grid2">
          <div>
            <label>Week number (optional)</label>
            <input id="weekNumber" type="number" min="1" max="53" placeholder="e.g. 12 or leave empty" />
          </div>
          <div>
            <label>Day</label>
            <select id="dayOfWeek">
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
              <option value="Sunday">Sunday</option>
            </select>
          </div>
        </div>
        <label>Time of prayer</label>
        <input id="meetingTime" type="text" placeholder="e.g. 7:00 PM" />
        <label>Tribe</label>
        <select id="tribeSelect"></select>
        <label>Hostel</label>
        <select id="hostelSelect"></select>
        <label>Hostel coordinator</label>
        <input id="coordinator" type="text" placeholder="Name of person in charge" />
        <label>Notes (optional)</label>
        <textarea id="notes" rows="2" placeholder="e.g. Hostel prayer / Bible study"></textarea>
        <button class="primary" id="saveBtn" type="button">Save slot</button>
        <button class="ghost" id="cancelEditBtn" type="button">Cancel edit</button>
        <div class="error" id="msgError"></div>
        <div class="ok" id="msgOk"></div>
      </div>

      <div class="card">
        <label>Filter by week (optional)</label>
        <input id="filterWeek" type="number" min="1" max="53" placeholder="Leave empty = all" />
        <label>Filter by hostel name (optional)</label>
        <input id="filterHostel" type="text" placeholder="Type hostel name" />
        <div id="list" style="margin-top:12px"></div>
      </div>
    </div>
  </div>
  <script>
    var SUPABASE_URL = "https://pexepaclinlqcwjuzhen.supabase.co";
    var SUPABASE_KEY = "sb_publishable_U7WdBF49bn0x0cJ8t3s2WQ_5w4mnty5";
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var loginView = document.getElementById("loginView");
    var appView = document.getElementById("appView");
    var loginError = document.getElementById("loginError");
    var msgError = document.getElementById("msgError");
    var msgOk = document.getElementById("msgOk");

    var tribes = [];
    var hostels = [];
    var schedules = [];

    function show(el, msg) {
      el.textContent = msg || "";
      if (msg) el.classList.add("show"); else el.classList.remove("show");
    }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function canAccess(uid) {
      return Promise.all([
        sb.from("admin_accounts").select("id").eq("id", uid).maybeSingle(),
        sb.from("president_accounts").select("id").eq("id", uid).maybeSingle()
      ]).then(function(res) {
        if (res[0].error) throw res[0].error;
        if (res[1].error) throw res[1].error;
        return !!(res[0].data || res[1].data);
      });
    }
    function tribeName(id) {
      for (var i = 0; i < tribes.length; i++) if (tribes[i].id === id) return tribes[i].name;
      return "—";
    }
    function hostelName(id) {
      for (var i = 0; i < hostels.length; i++) if (hostels[i].id === id) return hostels[i].name;
      return "—";
    }
    function dayOrder(d) {
      var map = {Monday:1,Tuesday:2,Wednesday:3,Thursday:4,Friday:5,Saturday:6,Sunday:7};
      return map[d] || 99;
    }
    function fillTribes() {
      var sel = document.getElementById("tribeSelect");
      var html = "";
      for (var i = 0; i < tribes.length; i++) {
        html += '<option value="' + tribes[i].id + '">' + esc(tribes[i].name) + "</option>";
      }
      sel.innerHTML = html || '<option value="">No tribes</option>';
      fillHostels();
    }
    function fillHostels() {
      var tribe = document.getElementById("tribeSelect").value;
      var sel = document.getElementById("hostelSelect");
      var html = "";
      for (var i = 0; i < hostels.length; i++) {
        if (tribe && hostels[i].tribe_id !== tribe) continue;
        html += '<option value="' + hostels[i].id + '">' + esc(hostels[i].name) + "</option>";
      }
      sel.innerHTML = html || '<option value="">No hostels for tribe</option>';
    }
    function resetForm() {
      document.getElementById("editId").value = "";
      document.getElementById("formTitle").textContent = "Add hostel prayer slot";
      document.getElementById("formHint").textContent = "Add as many rows as you want. Same hostel can meet many days.";
      document.getElementById("weekNumber").value = "";
      document.getElementById("meetingTime").value = "";
      document.getElementById("coordinator").value = "";
      document.getElementById("notes").value = "";
      document.getElementById("dayOfWeek").value = "Monday";
    }
    function renderList() {
      var week = document.getElementById("filterWeek").value;
      var hostelQ = document.getElementById("filterHostel").value.trim().toLowerCase();
      var rows = schedules.slice();
      if (week) {
        rows = rows.filter(function(s) { return String(s.week_number) === String(week); });
      }
      if (hostelQ) {
        rows = rows.filter(function(s) {
          return String(hostelName(s.hostel_id)).toLowerCase().indexOf(hostelQ) !== -1;
        });
      }
      rows.sort(function(a, b) {
        if (a.week_number !== b.week_number) return (a.week_number || 0) - (b.week_number || 0);
        var da = dayOrder(a.day_of_week), db = dayOrder(b.day_of_week);
        if (da !== db) return da - db;
        return String(hostelName(a.hostel_id)).localeCompare(String(hostelName(b.hostel_id)));
      });
      if (!rows.length) {
        document.getElementById("list").innerHTML = '<div class="meta">No timetable rows yet. Add hostels above (unlimited).</div>';
        return;
      }
      var html = "";
      for (var i = 0; i < rows.length; i++) {
        var s = rows[i];
        html += '<div class="item" data-id="' + s.id + '">';
        html += "<b>" + esc(hostelName(s.hostel_id)) + "</b>";
        html += '<div class="meta">' + esc(s.day_of_week || "—") + " · " + esc(s.meeting_time || "—");
        if (s.week_number != null) html += " · Week " + s.week_number;
        html += "</div>";
        html += '<div class="meta">Tribe: ' + esc(tribeName(s.tribe_id)) + "</div>";
        html += '<div class="meta">Coordinator: ' + esc(s.coordinator || "—") + "</div>";
        if (s.notes) html += '<div class="meta">' + esc(s.notes) + "</div>";
        html += '<div class="row-btns">';
        html += '<button class="primary edit-btn" type="button">Edit</button>';
        html += '<button class="danger del-btn" type="button">Delete</button>';
        html += "</div></div>";
      }
      document.getElementById("list").innerHTML = html;
      var items = document.querySelectorAll("#list .item");
      for (var j = 0; j < items.length; j++) {
        (function(item) {
          var id = item.getAttribute("data-id");
          item.querySelector(".edit-btn").onclick = function() {
            var row = null;
            for (var k = 0; k < schedules.length; k++) if (schedules[k].id === id) row = schedules[k];
            if (!row) return;
            document.getElementById("editId").value = row.id;
            document.getElementById("formTitle").textContent = "Edit hostel prayer slot";
            document.getElementById("formHint").textContent = "Change details then tap Save slot.";
            document.getElementById("weekNumber").value = row.week_number == null ? "" : row.week_number;
            document.getElementById("dayOfWeek").value = row.day_of_week || "Monday";
            document.getElementById("meetingTime").value = row.meeting_time || "";
            document.getElementById("coordinator").value = row.coordinator || "";
            document.getElementById("notes").value = row.notes || "";
            document.getElementById("tribeSelect").value = row.tribe_id || "";
            fillHostels();
            document.getElementById("hostelSelect").value = row.hostel_id || "";
            show(msgOk, "Editing this row. Save when ready.");
            show(msgError, "");
            window.scrollTo(0, 0);
          };
          item.querySelector(".del-btn").onclick = function() {
            if (!confirm("Delete this timetable row?")) return;
            show(msgError, ""); show(msgOk, "");
            sb.from("hostel_schedules").delete().eq("id", id).then(function(res) {
              if (res.error) return show(msgError, res.error.message);
              show(msgOk, "Deleted.");
              if (document.getElementById("editId").value === id) resetForm();
              return loadAll();
            });
          };
        })(items[j]);
      }
    }
    function loadAll() {
      show(msgError, "");
      return Promise.all([
        sb.from("tribes").select("id, name").order("name"),
        sb.from("hostels").select("id, name, tribe_id").order("name"),
        sb.from("hostel_schedules").select("*").order("week_number")
      ]).then(function(results) {
        if (results[0].error) throw results[0].error;
        if (results[1].error) throw results[1].error;
        if (results[2].error) throw results[2].error;
        tribes = results[0].data || [];
        hostels = results[1].data || [];
        schedules = results[2].data || [];
        fillTribes();
        renderList();
      });
    }

    document.getElementById("tribeSelect").onchange = fillHostels;
    document.getElementById("filterWeek").oninput = renderList;
    document.getElementById("filterHostel").oninput = renderList;
    document.getElementById("cancelEditBtn").onclick = function() {
      resetForm();
      show(msgOk, "Edit cancelled.");
      show(msgError, "");
    };

    document.getElementById("saveBtn").onclick = function() {
      show(msgError, ""); show(msgOk, "");
      var editId = document.getElementById("editId").value;
      var weekVal = document.getElementById("weekNumber").value;
      var week = weekVal === "" ? null : Number(weekVal);
      var day = document.getElementById("dayOfWeek").value;
      var time = document.getElementById("meetingTime").value.trim();
      var tribe_id = document.getElementById("tribeSelect").value;
      var hostel_id = document.getElementById("hostelSelect").value;
      var coordinator = document.getElementById("coordinator").value.trim() || null;
      var notes = document.getElementById("notes").value.trim() || null;
      if (!day) return show(msgError, "Select a day.");
      if (!time) return show(msgError, "Enter prayer time.");
      if (!tribe_id) return show(msgError, "Select a tribe.");
      if (!hostel_id) return show(msgError, "Select a hostel.");
      if (!coordinator) return show(msgError, "Enter hostel coordinator name.");

      var payload = {
        week_number: week,
        day_of_week: day,
        meeting_time: time,
        tribe_id: tribe_id,
        hostel_id: hostel_id,
        coordinator: coordinator,
        notes: notes
      };

      var req;
      if (editId) {
        req = sb.from("hostel_schedules").update(payload).eq("id", editId);
      } else {
        req = sb.from("hostel_schedules").insert(payload);
      }
      req.then(function(res) {
        if (res.error) return show(msgError, res.error.message);
        show(msgOk, editId ? "Updated." : "Saved. Add more hostels or more days anytime.");
        resetForm();
        return loadAll();
      });
    };

    document.getElementById("loginBtn").onclick = function() {
      show(loginError, "");
      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value;
      sb.auth.signInWithPassword({ email: email, password: password }).then(function(res) {
        if (res.error) throw res.error;
        return canAccess(res.data.user.id).then(function(ok) {
          if (!ok) {
            return sb.auth.signOut().then(function() {
              throw new Error("Only HPF Admin or President can open the timetable.");
            });
          }
          loginView.classList.add("hidden");
          appView.classList.remove("hidden");
          return loadAll();
        });
      }).catch(function(err) {
        show(loginError, err.message || String(err));
      });
    };

    document.getElementById("logoutBtn").onclick = function() {
      sb.auth.signOut().then(function() {
        appView.classList.add("hidden");
        loginView.classList.remove("hidden");
      });
    };

    sb.auth.getSession().then(function(res) {
      if (!res.data.session) return;
      canAccess(res.data.session.user.id).then(function(ok) {
        if (!ok) return;
        loginView.classList.add("hidden");
        appView.classList.remove("hidden");
        loadAll().catch(function(e) { show(msgError, e.message || String(e)); });
      });
    });
  </script>
</body>
</html>
