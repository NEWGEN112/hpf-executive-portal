<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HPF Accounts</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#0b0f0c; --card:#121a14; --line:#1e2a22; --text:#e8f0ea;
      --muted:#8fa396; --accent:#c8f54a; --input:#0e1511;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:radial-gradient(1200px 600px at 50% -10%,#16301c 0%,var(--bg) 55%);
    }
    .wrap{max-width:960px;margin:0 auto;padding:20px 12px 40px}
    .logo{
      width:56px;height:56px;border-radius:14px;object-fit:cover;display:block;
      margin:0 auto 12px;border:2px solid var(--accent);background:#0e1511;
    }
    .pill{text-align:center;color:var(--accent);font-size:12px;letter-spacing:.12em;font-weight:700;margin:0 0 6px}
    h1{text-align:center;margin:0 0 6px;font-size:24px}
    .sub{text-align:center;color:var(--muted);margin:0 0 16px;font-size:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
    label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
    input,select,textarea{
      width:100%;background:var(--input);border:1px solid var(--line);border-radius:10px;
      padding:11px 12px;color:var(--text);font-size:15px;outline:none;font-family:inherit
    }
    button{border:0;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer}
    .primary{background:var(--accent);color:#111;width:100%;margin-top:10px}
    .ghost{background:transparent;color:var(--muted)}
    .danger{background:#3a1515;color:#ffb4b4;border:1px solid #5c2424}
    .row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .row-btns button{flex:1;min-width:90px}
    .error,.ok{display:none;margin-top:10px;border-radius:10px;padding:10px;font-size:14px}
    .error{background:#3a1515;color:#ffb4b4;border:1px solid #5c2424}
    .ok{background:#14301a;color:#b7f5c2;border:1px solid #2a5a36}
    .error.show,.ok.show{display:block}
    .hidden{display:none!important}
    .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
    .top h1{margin:0;font-size:22px;text-align:left}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    @media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
    .stat{background:#0e1511;border:1px solid var(--line);border-radius:14px;padding:14px}
    .stat .n{font-size:22px;font-weight:800;color:var(--accent);line-height:1.1}
    .stat .l{font-size:12px;color:var(--muted);margin-top:4px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .tab{background:#0e1511;color:var(--muted);border:1px solid var(--line);padding:12px}
    .tab.active{background:#1a2a1e;color:var(--accent);border-color:#2f4a36}
    .item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:#0e1511}
    .item b{color:var(--accent)}
    .meta{color:var(--muted);font-size:12px;margin-top:4px}
    .banner{background:#1a2a1e;border:1px solid #2f4a36;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loginView">
      <img class="logo" src="./hpf-logo.jpg" alt="HPF Logo" />
      <p class="pill">HPF ACCOUNTS</p>
      <h1>Account Officer</h1>
      <p class="sub">Income, expenses and balance</p>
      <div class="card">
        <label>Email</label>
        <input id="email" type="email" />
        <label>Password</label>
        <input id="password" type="password" />
        <button class="primary" id="loginBtn" type="button">Sign in</button>
        <div class="error" id="loginError"></div>
      </div>
      <p class="sub">Account Officer can edit. President can view only.</p>
    </div>

    <div id="appView" class="hidden">
      <img class="logo" src="./hpf-logo.jpg" alt="HPF Logo" />
      <p class="pill">HPF ACCOUNTS</p>
      <div class="top">
        <h1>Accounts</h1>
        <button class="ghost" id="logoutBtn" type="button">Sign out</button>
      </div>
      <div class="banner" id="roleBanner">Loading...</div>
      <div class="grid" id="stats"></div>

      <div class="tabs">
        <button class="tab active" data-tab="income" type="button">Income</button>
        <button class="tab" data-tab="expense" type="button">Expense</button>
      </div>

      <div id="panel-income">
        <div class="card" id="incomeFormCard">
          <div style="font-weight:700;margin-bottom:6px">Add income</div>
          <input type="hidden" id="incomeEditId" value="" />
          <div class="grid2">
            <div>
              <label>Date</label>
              <input id="incomeDate" type="date" />
            </div>
            <div>
              <label>Amount</label>
              <input id="incomeAmount" type="number" min="0" step="0.01" placeholder="0" />
            </div>
          </div>
          <label>Type</label>
          <input id="incomeType" type="text" placeholder="e.g. Offering, Dues, Donation" />
          <label>From</label>
          <input id="incomeFrom" type="text" placeholder="Who / where from" />
          <label>Notes</label>
          <textarea id="incomeNotes" rows="2" placeholder="Optional notes"></textarea>
          <button class="primary" id="saveIncomeBtn" type="button">Save income</button>
          <button class="ghost" id="cancelIncomeBtn" type="button">Cancel edit</button>
        </div>
        <div class="card">
          <div style="font-weight:700;margin-bottom:8px">Income list</div>
          <div id="incomeList" class="meta">Loading...</div>
        </div>
      </div>

      <div id="panel-expense" class="hidden">
        <div class="card" id="expenseFormCard">
          <div style="font-weight:700;margin-bottom:6px">Add expense</div>
          <input type="hidden" id="expenseEditId" value="" />
          <div class="grid2">
            <div>
              <label>Date</label>
              <input id="expenseDate" type="date" />
            </div>
            <div>
              <label>Amount</label>
              <input id="expenseAmount" type="number" min="0" step="0.01" placeholder="0" />
            </div>
          </div>
          <label>Category</label>
          <input id="expenseCategory" type="text" placeholder="e.g. Transport, Materials, Welfare" />
          <label>Paid to</label>
          <input id="expensePaidTo" type="text" placeholder="Who was paid" />
          <label>Notes</label>
          <textarea id="expenseNotes" rows="2" placeholder="Optional notes"></textarea>
          <button class="primary" id="saveExpenseBtn" type="button">Save expense</button>
          <button class="ghost" id="cancelExpenseBtn" type="button">Cancel edit</button>
        </div>
        <div class="card">
          <div style="font-weight:700;margin-bottom:8px">Expense list</div>
          <div id="expenseList" class="meta">Loading...</div>
        </div>
      </div>

      <div class="error" id="msgError"></div>
      <div class="ok" id="msgOk"></div>
    </div>
  </div>
  <script>
    var SUPABASE_URL = "https://pexepaclinlqcwjuzhen.supabase.co";
    var SUPABASE_KEY = "sb_publishable_U7WdBF49bn0x0cJ8t3s2WQ_5w4mnty5";
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var loginView = document.getElementById("loginView");
    var appView = document.getElementById("appView");
    var loginError = document.getElementById("loginError");
    var msgError = document.getElementById("msgError");
    var msgOk = document.getElementById("msgOk");

    var role = null;
    var canEdit = false;
    var incomes = [];
    var expenses = [];

    function show(el, msg) {
      el.textContent = msg || "";
      if (msg) el.classList.add("show"); else el.classList.remove("show");
    }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function money(n) {
      var x = Number(n) || 0;
      return x.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function todayISO() {
      var d = new Date();
      var m = String(d.getMonth() + 1).padStart(2, "0");
      var day = String(d.getDate()).padStart(2, "0");
      return d.getFullYear() + "-" + m + "-" + day;
    }
    function resolveRole(uid) {
      return Promise.all([
        sb.from("account_officer_accounts").select("id, full_name, email").eq("id", uid).maybeSingle(),
        sb.from("president_accounts").select("id, full_name, email").eq("id", uid).maybeSingle()
      ]).then(function(res) {
        if (res[0].error) throw res[0].error;
        if (res[1].error) throw res[1].error;
        if (res[0].data) return { role: "officer", profile: res[0].data, canEdit: true };
        if (res[1].data) return { role: "president", profile: res[1].data, canEdit: false };
        return null;
      });
    }
    function setEditMode(on) {
      canEdit = !!on;
      document.getElementById("incomeFormCard").classList.toggle("hidden", !on);
      document.getElementById("expenseFormCard").classList.toggle("hidden", !on);
    }
    function renderStats() {
      var inc = 0, exp = 0;
      for (var i = 0; i < incomes.length; i++) inc += Number(incomes[i].amount) || 0;
      for (var j = 0; j < expenses.length; j++) exp += Number(expenses[j].amount) || 0;
      var bal = inc - exp;
      document.getElementById("stats").innerHTML =
        '<div class="stat"><div class="n">' + money(inc) + '</div><div class="l">Total income</div></div>' +
        '<div class="stat"><div class="n">' + money(exp) + '</div><div class="l">Total expenses</div></div>' +
        '<div class="stat"><div class="n">' + money(bal) + '</div><div class="l">Balance</div></div>' +
        '<div class="stat"><div class="n">' + (incomes.length + expenses.length) + '</div><div class="l">All records</div></div>';
    }
    function renderIncome() {
      if (!incomes.length) {
        document.getElementById("incomeList").innerHTML = '<div class="meta">No income records yet.</div>';
        return;
      }
      var rows = incomes.slice().sort(function(a, b) {
        return String(b.txn_date || "").localeCompare(String(a.txn_date || ""));
      });
      var html = "";
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        html += '<div class="item" data-id="' + r.id + '">';
        html += "<b>" + esc(r.type || "Income") + " · " + money(r.amount) + "</b>";
        html += '<div class="meta">' + esc(r.txn_date || "—") + " · From: " + esc(r.from_name || "—") + "</div>";
        if (r.notes) html += '<div class="meta">' + esc(r.notes) + "</div>";
        if (canEdit) {
          html += '<div class="row-btns"><button class="primary edit-income" type="button">Edit</button>';
          html += '<button class="danger del-income" type="button">Delete</button></div>';
        }
        html += "</div>";
      }
      document.getElementById("incomeList").innerHTML = html;
      if (!canEdit) return;
      var items = document.querySelectorAll("#incomeList .item");
      for (var j = 0; j < items.length; j++) {
        (function(item) {
          var id = item.getAttribute("data-id");
          item.querySelector(".edit-income").onclick = function() {
            var row = null;
            for (var k = 0; k < incomes.length; k++) if (String(incomes[k].id) === String(id)) row = incomes[k];
            if (!row) return;
            document.getElementById("incomeEditId").value = row.id;
            document.getElementById("incomeDate").value = row.txn_date || "";
            document.getElementById("incomeAmount").value = row.amount == null ? "" : row.amount;
            document.getElementById("incomeType").value = row.type || "";
            document.getElementById("incomeFrom").value = row.from_name || "";
            document.getElementById("incomeNotes").value = row.notes || "";
            show(msgOk, "Editing income. Save when ready.");
            show(msgError, "");
            window.scrollTo(0, 0);
          };
          item.querySelector(".del-income").onclick = function() {
            if (!confirm("Delete this income record?")) return;
            show(msgError, ""); show(msgOk, "");
            sb.from("finance_income").delete().eq("id", id).then(function(res) {
              if (res.error) return show(msgError, res.error.message);
              show(msgOk, "Income deleted.");
              return loadAll();
            });
          };
        })(items[j]);
      }
    }function renderExpense() {
      if (!expenses.length) {
        document.getElementById("expenseList").innerHTML = '<div class="meta">No expense records yet.</div>';
        return;
      }
      var rows = expenses.slice().sort(function(a, b) {
        return String(b.txn_date || "").localeCompare(String(a.txn_date || ""));
      });
      var html = "";
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        html += '<div class="item" data-id="' + r.id + '">';
        html += "<b>" + esc(r.category || "Expense") + " · " + money(r.amount) + "</b>";
        html += '<div class="meta">' + esc(r.txn_date || "—") + " · Paid to: " + esc(r.paid_to || "—") + "</div>";
        if (r.notes) html += '<div class="meta">' + esc(r.notes) + "</div>";
        if (canEdit) {
          html += '<div class="row-btns"><button class="primary edit-expense" type="button">Edit</button>';
          html += '<button class="danger del-expense" type="button">Delete</button></div>';
        }
        html += "</div>";
      }
      document.getElementById("expenseList").innerHTML = html;
      if (!canEdit) return;
      var items = document.querySelectorAll("#expenseList .item");
      for (var j = 0; j < items.length; j++) {
        (function(item) {
          var id = item.getAttribute("data-id");
          item.querySelector(".edit-expense").onclick = function() {
            var row = null;
            for (var k = 0; k < expenses.length; k++) if (String(expenses[k].id) === String(id)) row = expenses[k];
            if (!row) return;
            document.getElementById("expenseEditId").value = row.id;
            document.getElementById("expenseDate").value = row.txn_date || "";
            document.getElementById("expenseAmount").value = row.amount == null ? "" : row.amount;
            document.getElementById("expenseCategory").value = row.category || "";
            document.getElementById("expensePaidTo").value = row.paid_to || "";
            document.getElementById("expenseNotes").value = row.notes || "";
            show(msgOk, "Editing expense. Save when ready.");
            show(msgError, "");
            window.scrollTo(0, 0);
          };
          item.querySelector(".del-expense").onclick = function() {
            if (!confirm("Delete this expense record?")) return;
            show(msgError, ""); show(msgOk, "");
            sb.from("finance_expenses").delete().eq("id", id).then(function(res) {
              if (res.error) return show(msgError, res.error.message);
              show(msgOk, "Expense deleted.");
              return loadAll();
            });
          };
        })(items[j]);
      }
    }
    function loadAll() {
      show(msgError, "");
      return Promise.all([
        sb.from("finance_income").select("*").order("txn_date", { ascending: false }),
        sb.from("finance_expenses").select("*").order("txn_date", { ascending: false })
      ]).then(function(results) {
        if (results[0].error) throw results[0].error;
        if (results[1].error) throw results[1].error;
        incomes = results[0].data || [];
        expenses = results[1].data || [];
        renderStats();
        renderIncome();
        renderExpense();
      });
    }
    function openApp(info) {
      role = info.role;
      setEditMode(info.canEdit);
      var label = info.role === "officer" ? "Account Officer (can edit)" : "President (view only)";
      document.getElementById("roleBanner").textContent =
        label + " · " + (info.profile.full_name || info.profile.email || "");
      if (!document.getElementById("incomeDate").value) document.getElementById("incomeDate").value = todayISO();
      if (!document.getElementById("expenseDate").value) document.getElementById("expenseDate").value = todayISO();
      loginView.classList.add("hidden");
      appView.classList.remove("hidden");
      return loadAll();
    }

    document.querySelectorAll(".tab").forEach(function(btn) {
      btn.onclick = function() {
        document.querySelectorAll(".tab").forEach(function(b) { b.classList.remove("active"); });
        btn.classList.add("active");
        var tab = btn.getAttribute("data-tab");
        document.getElementById("panel-income").classList.toggle("hidden", tab !== "income");
        document.getElementById("panel-expense").classList.toggle("hidden", tab !== "expense");
      };
    });

    document.getElementById("cancelIncomeBtn").onclick = function() {
      document.getElementById("incomeEditId").value = "";
      document.getElementById("incomeAmount").value = "";
      document.getElementById("incomeType").value = "";
      document.getElementById("incomeFrom").value = "";
      document.getElementById("incomeNotes").value = "";
      document.getElementById("incomeDate").value = todayISO();
      show(msgOk, "Income edit cancelled.");
    };
    document.getElementById("cancelExpenseBtn").onclick = function() {
      document.getElementById("expenseEditId").value = "";
      document.getElementById("expenseAmount").value = "";
      document.getElementById("expenseCategory").value = "";
      document.getElementById("expensePaidTo").value = "";
      document.getElementById("expenseNotes").value = "";
      document.getElementById("expenseDate").value = todayISO();
      show(msgOk, "Expense edit cancelled.");
    };

    document.getElementById("saveIncomeBtn").onclick = function() {
      if (!canEdit) return show(msgError, "President can view only.");
      show(msgError, ""); show(msgOk, "");
      var editId = document.getElementById("incomeEditId").value;
      var txn_date = document.getElementById("incomeDate").value;
      var amount = Number(document.getElementById("incomeAmount").value);
      var type = document.getElementById("incomeType").value.trim();
      var from_name = document.getElementById("incomeFrom").value.trim();
      var notes = document.getElementById("incomeNotes").value.trim() || null;
      if (!txn_date) return show(msgError, "Enter date.");
      if (!(amount > 0)) return show(msgError, "Enter amount greater than 0.");
      if (!type) return show(msgError, "Enter type.");
      if (!from_name) return show(msgError, "Enter From.");
      var payload = { txn_date: txn_date, amount: amount, type: type, from_name: from_name, notes: notes };
      var req = editId
        ? sb.from("finance_income").update(payload).eq("id", editId)
        : sb.from("finance_income").insert(payload);
      req.then(function(res) {
        if (res.error) return show(msgError, res.error.message);
        show(msgOk, editId ? "Income updated." : "Income saved.");
        document.getElementById("incomeEditId").value = "";
        document.getElementById("incomeAmount").value = "";
        document.getElementById("incomeType").value = "";
        document.getElementById("incomeFrom").value = "";
        document.getElementById("incomeNotes").value = "";
        document.getElementById("incomeDate").value = todayISO();
        return loadAll();
      });
    };

    document.getElementById("saveExpenseBtn").onclick = function() {
      if (!canEdit) return show(msgError, "President can view only.");
      show(msgError, ""); show(msgOk, "");
      var editId = document.getElementById("expenseEditId").value;
      var txn_date = document.getElementById("expenseDate").value;
      var amount = Number(document.getElementById("expenseAmount").value);
      var category = document.getElementById("expenseCategory").value.trim();
      var paid_to = document.getElementById("expensePaidTo").value.trim();
      var notes = document.getElementById("expenseNotes").value.trim() || null;
      if (!txn_date) return show(msgError, "Enter date.");
      if (!(amount > 0)) return show(msgError, "Enter amount greater than 0.");
      if (!category) return show(msgError, "Enter category.");
      if (!paid_to) return show(msgError, "Enter Paid to.");
      var payload = { txn_date: txn_date, amount: amount, category: category, paid_to: paid_to, notes: notes };
      var req = editId
        ? sb.from("finance_expenses").update(payload).eq("id", editId)
        : sb.from("finance_expenses").insert(payload);
      req.then(function(res) {
        if (res.error) return show(msgError, res.error.message);
        show(msgOk, editId ? "Expense updated." : "Expense saved.");
        document.getElementById("expenseEditId").value = "";
        document.getElementById("expenseAmount").value = "";
        document.getElementById("expenseCategory").value = "";
        document.getElementById("expensePaidTo").value = "";
        document.getElementById("expenseNotes").value = "";
        document.getElementById("expenseDate").value = todayISO();
        return loadAll();
      });
    };

    document.getElementById("loginBtn").onclick = function() {
      show(loginError, "");
      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value;
      sb.auth.signInWithPassword({ email: email, password: password }).then(function(res) {
        if (res.error) throw res.error;
        return resolveRole(res.data.user.id).then(function(info) {
          if (!info) {
            return sb.auth.signOut().then(function() {
              throw new Error("This account is not Account Officer or President.");
            });
          }
          return openApp(info);
        });
      }).catch(function(err) {
        show(loginError, err.message || String(err));
      });
    };

    document.getElementById("logoutBtn").onclick = function() {
      sb.auth.signOut().then(function() {
        appView.classList.add("hidden");
        loginView.classList.remove("hidden");
      });
    };

    sb.auth.getSession().then(function(res) {
      if (!res.data.session) return;
      resolveRole(res.data.session.user.id).then(function(info) {
        if (!info) return;
        openApp(info).catch(function(e) { show(msgError, e.message || String(e)); });
      });
    });
  </script>
</body>
</html>
