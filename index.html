<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HPF Executive Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0f0c;
      --card: #121a14;
      --line: #1e2a22;
      --text: #e8f0ea;
      --muted: #8fa396;
      --accent: #c8f54a;
      --input: #0e1511;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #16301c 0%, var(--bg) 55%);
      color: var(--text);
    }
    .wrap { max-width: 420px; margin: 0 auto; padding: 32px 16px 48px; }
    .logo {
      width: 48px; height: 48px; border-radius: 12px;
      background: var(--accent); color: #111;
      display: grid; place-items: center;
      font-weight: 800; font-size: 22px; margin: 0 auto 12px;
    }
    .pill {
      text-align: center; color: var(--accent);
      font-size: 12px; letter-spacing: 0.12em; font-weight: 700; margin: 0 0 6px;
    }
    h1 { text-align: center; margin: 0 0 8px; font-size: 28px; }
    .sub { text-align: center; color: var(--muted); margin: 0 0 24px; font-size: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 20px;
    }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
    input, select, textarea {
      width: 100%; background: var(--input); border: 1px solid var(--line);
      border-radius: 10px; padding: 12px 14px; color: var(--text);
      font-size: 15px; outline: none; font-family: inherit;
    }
    textarea { min-height: 100px; resize: vertical; }
    button {
      width: 100%; margin-top: 18px; border: 0; border-radius: 10px;
      padding: 13px 16px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .primary { background: var(--accent); color: #111; }
    .primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .ghost { background: transparent; color: var(--muted); margin-top: 10px; font-weight: 600; }
    .error, .ok {
      display: none; margin-top: 12px; border-radius: 10px;
      padding: 10px 12px; font-size: 14px;
    }
    .error { background: #3a1515; color: #ffb4b4; border: 1px solid #5c2424; }
    .ok { background: #14301a; color: #b7f5c2; border: 1px solid #2a5a36; }
    .error.show, .ok.show { display: block; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .tab {
      background: #0e1511; color: var(--muted);
      border: 1px solid var(--line); margin-top: 0;
    }
    .tab.active { background: #1a2a1e; color: var(--accent); border-color: #2f4a36; }
    .dash h2 { margin: 0 0 8px; font-size: 22px; }
    .meta { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
    .row {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px;
    }
    .row:last-child { border-bottom: 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="authView">
      <img class="logo" src="./hpf-logo.jpg" alt="HPF Logo" />
      <p class="pill">HPF EXECUTIVE</p>
      <h1>Executive Portal</h1>
      <p class="sub">Register with your tribe code or sign in</p>
      <div class="card">
        <div class="tabs">
          <button class="tab active" id="tabLogin" type="button">Sign in</button>
          <button class="tab" id="tabRegister" type="button">Register</button>
        </div>
        <form id="loginForm">
          <label>Email</label>
          <input id="loginEmail" type="email" required placeholder="you@email.com" />
          <label>Password</label>
          <input id="loginPassword" type="password" required placeholder="Your password" />
          <button class="primary" type="submit" id="loginBtn">Sign in</button>
        </form>
        <form id="registerForm" class="hidden">
          <label>Tribe name (exact)</label>
          <input id="regTribe" type="text" required placeholder="e.g. Lion Tribe" />
          <label>Registration code (from HPF Admin)</label>
          <input id="regCode" type="text" required placeholder="e.g. LION2026" />
          <label>Full name</label>
          <input id="regName" type="text" required placeholder="Your full name" />
          <label>Email</label>
          <input id="regEmail" type="email" required placeholder="you@email.com" />
          <label>Password</label>
          <input id="regPassword" type="password" required minlength="6" placeholder="Create a password" />
          <button class="primary" type="submit" id="regBtn">Create executive account</button>
        </form>
        <div class="error" id="errorBox"></div>
        <div class="ok" id="okBox"></div>
      </div>
    </div>

    <div id="dashView" class="hidden">
      <img class="logo" src="./hpf-logo.jpg" alt="HPF Logo" />
      <p class="pill">HPF EXECUTIVE</p>
      <div class="card dash">
        <h2 id="welcome">Welcome</h2>
        <p class="meta" id="execMeta">—</p>
        <div class="row"><span>Tribe</span><strong id="tribeName">—</strong></div>
        <div class="row"><span>Email</span><strong id="execEmail">—</strong></div>

        <a href="./executive-schedule.html" class="primary" style="display:block;text-align:center;text-decoration:none;margin-top:16px;">My Schedule</a>

        <h2 style="margin-top:22px;font-size:18px;">Weekly report</h2>

        <label>Hostel</label>
        <select id="hostelSelect"></select>

        <label>Message title</label>
        <input id="reportTitle" type="text" placeholder="e.g. Sunday fellowship" />

        <label>Duration</label>
        <input id="reportDuration" type="text" placeholder="e.g. 1 hour 30 mins" />

        <label>Number of attendance</label>
        <input id="reportAttendance" type="number" min="0" placeholder="e.g. 25" />

        <label>Comment</label>
        <textarea id="reportComment" placeholder="Write your comment / report details..."></textarea>

        <label>Week number</label>
        <input id="weekNumber" type="number" min="1" max="53" placeholder="e.g. 12" />

        <button class="primary" type="button" id="submitReport">Submit report</button>
        <button class="ghost" type="button" id="logoutBtn">Sign out</button>
        <div class="error" id="dashError"></div>
        <div class="ok" id="dashOk"></div>
      </div>
    </div>
          </div>
          <script>
    const SUPABASE_URL = "https://pexepaclinlqcwjuzhen.supabase.co";
    const SUPABASE_KEY = "sb_publishable_U7WdBF49bn0x0cJ8t3s2WQ_5w4mnty5";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const authView = document.getElementById("authView");
    const dashView = document.getElementById("dashView");
    const errorBox = document.getElementById("errorBox");
    const okBox = document.getElementById("okBox");
    const dashError = document.getElementById("dashError");
    const dashOk = document.getElementById("dashOk");
    let currentExec = null;

    function showError(el, msg) {
      el.textContent = msg || "";
      el.classList.toggle("show", !!msg);
    }
    function showOk(el, msg) {
      el.textContent = msg || "";
      el.classList.toggle("show", !!msg);
    }

    document.getElementById("tabLogin").onclick = () => {
      document.getElementById("tabLogin").classList.add("active");
      document.getElementById("tabRegister").classList.remove("active");
      document.getElementById("loginForm").classList.remove("hidden");
      document.getElementById("registerForm").classList.add("hidden");
      showError(errorBox, ""); showOk(okBox, "");
    };
    document.getElementById("tabRegister").onclick = () => {
      document.getElementById("tabRegister").classList.add("active");
      document.getElementById("tabLogin").classList.remove("active");
      document.getElementById("registerForm").classList.remove("hidden");
      document.getElementById("loginForm").classList.add("hidden");
      showError(errorBox, ""); showOk(okBox, "");
    };

    document.getElementById("registerForm").onsubmit = async (e) => {
      e.preventDefault();
      showError(errorBox, ""); showOk(okBox, "");
      const tribeName = document.getElementById("regTribe").value.trim();
      const code = document.getElementById("regCode").value.trim();
      const fullName = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;
      const btn = document.getElementById("regBtn");
      btn.disabled = true; btn.textContent = "Creating...";
      try {
        const { data: tribe, error: tribeErr } = await sb
          .from("tribes")
          .select("id, name, registration_code")
          .ilike("name", tribeName)
          .eq("registration_code", code)
          .maybeSingle();
        if (tribeErr) throw tribeErr;
        if (!tribe) throw new Error("Tribe name or registration code is incorrect. Ask HPF Admin.");

        const { data: sign, error: signErr } = await sb.auth.signUp({ email, password });
        if (signErr) throw signErr;
        if (!sign.user) throw new Error("Could not create account. Try another email.");

        const { error: insErr } = await sb.from("executive_accounts").insert({
          id: sign.user.id,
          full_name: fullName,
          email: email,
          tribe_id: tribe.id
        });
        if (insErr) throw insErr;

        showOk(okBox, "Account created! You can now Sign in.");
        document.getElementById("tabLogin").click();
        document.getElementById("loginEmail").value = email;
      } catch (err) {
        showError(errorBox, err.message || String(err));
      } finally {
        btn.disabled = false; btn.textContent = "Create executive account";
      }
    };

    document.getElementById("loginForm").onsubmit = async (e) => {
      e.preventDefault();
      showError(errorBox, ""); showOk(okBox, "");
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const btn = document.getElementById("loginBtn");
      btn.disabled = true; btn.textContent = "Signing in...";
      try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;

        const { data: exec, error: execErr } = await sb
          .from("executive_accounts")
          .select("id, full_name, email, tribe_id")
          .eq("id", data.user.id)
          .maybeSingle();
        if (execErr) throw execErr;
        if (!exec) {
          await sb.auth.signOut();
          throw new Error("This account is not registered as an HPF Executive.");
        }
        await openDashboard(exec);
      } catch (err) {
        showError(errorBox, err.message || String(err));
      } finally {
        btn.disabled = false; btn.textContent = "Sign in";
      }
    };

    async function openDashboard(exec) {
      currentExec = exec;
      authView.classList.add("hidden");
      dashView.classList.remove("hidden");
      document.getElementById("welcome").textContent = "Welcome, " + (exec.full_name || "Executive");
      document.getElementById("execEmail").textContent = exec.email || "—";
      document.getElementById("execMeta").textContent = "You are signed in as Executive";

      const { data: tribe } = await sb.from("tribes").select("name").eq("id", exec.tribe_id).maybeSingle();
      document.getElementById("tribeName").textContent = tribe?.name || "—";

      const { data: hostels } = await sb
        .from("hostels").select("id, name").eq("tribe_id", exec.tribe_id).order("name");
      const sel = document.getElementById("hostelSelect");
      sel.innerHTML = "";
      (hostels || []).forEach(h => {
        const opt = document.createElement("option");
        opt.value = h.id; opt.textContent = h.name; sel.appendChild(opt);
      });
      if (!hostels || !hostels.length) {
        const opt = document.createElement("option");
        opt.value = ""; opt.textContent = "No hostels yet — ask Admin to add some";
        sel.appendChild(opt);
      }
    }

    document.getElementById("submitReport").onclick = async () => {
      showError(dashError, ""); showOk(dashOk, "");
      const hostelId = document.getElementById("hostelSelect").value;
      const title = document.getElementById("reportTitle").value.trim();
      const duration = document.getElementById("reportDuration").value.trim();
      const attendance = Number(document.getElementById("reportAttendance").value);
      const comment = document.getElementById("reportComment").value.trim();
      const week = Number(document.getElementById("weekNumber").value);

      if (!hostelId) return showError(dashError, "Select a hostel.");
      if (!title) return showError(dashError, "Enter message title.");
      if (!duration) return showError(dashError, "Enter duration.");
      if (!document.getElementById("reportAttendance").value) return showError(dashError, "Enter number of attendance.");
      if (!comment) return showError(dashError, "Enter comment.");
      if (!week) return showError(dashError, "Enter week number.");

      const { error } = await sb.from("weekly_reports").insert({
        tribe_id: currentExec.tribe_id,
        hostel_id: hostelId,
        executive_id: currentExec.id,
        week_number: week,
        title: title,
        duration: duration,
        attendance: attendance,
        comment: comment,
        content: comment
      });

      if (error) showError(dashError, error.message);
      else {
        showOk(dashOk, "Report submitted. Admin can see it now.");
        document.getElementById("reportTitle").value = "";
        document.getElementById("reportDuration").value = "";
        document.getElementById("reportAttendance").value = "";
        document.getElementById("reportComment").value = "";
        document.getElementById("weekNumber").value = "";
      }
    };

    document.getElementById("logoutBtn").onclick = async () => {
      await sb.auth.signOut();
      currentExec = null;
      dashView.classList.add("hidden");
      authView.classList.remove("hidden");
    };

    (async () => {
      const { data } = await sb.auth.getSession();
      if (!data.session) return;
      const { data: exec } = await sb
        .from("executive_accounts")
        .select("id, full_name, email, tribe_id")
        .eq("id", data.session.user.id)
        .maybeSingle();
      if (exec) openDashboard(exec);
    })();
  </script>
</body>
</html>
