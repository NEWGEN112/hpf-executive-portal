<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HPF Admin — Full Reports</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0f0c; --card: #121a14; --line: #1e2a22;
      --text: #e8f0ea; --muted: #8fa396; --accent: #c8f54a; --input: #0e1511;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #16301c 0%, var(--bg) 55%);
      color: var(--text);
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 24px 14px 48px; }
    .logo {
      width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: #111;
      display: grid; place-items: center; font-weight: 800; font-size: 20px; margin: 0 auto 10px;
    }
    .pill { text-align: center; color: var(--accent); font-size: 12px; letter-spacing: .12em; font-weight: 700; margin: 0 0 6px; }
    h1 { text-align: center; margin: 0 0 8px; font-size: 24px; }
    .sub { text-align: center; color: var(--muted); margin: 0 0 20px; font-size: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 16px;
    }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
    input {
      width: 100%; background: var(--input); border: 1px solid var(--line);
      border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 15px; outline: none;
    }
    button {
      width: 100%; margin-top: 16px; border: 0; border-radius: 10px;
      padding: 12px 16px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .primary { background: var(--accent); color: #111; }
    .ghost { background: transparent; color: var(--muted); font-weight: 600; }
    .error, .ok {
      display: none; margin-top: 12px; border-radius: 10px; padding: 10px 12px; font-size: 14px;
    }
    .error { background: #3a1515; color: #ffb4b4; border: 1px solid #5c2424; }
    .ok { background: #14301a; color: #b7f5c2; border: 1px solid #2a5a36; }
    .error.show, .ok.show { display: block; }
    .hidden { display: none !important; }
    .head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .head h2 { margin: 0; font-size: 20px; }
    .report {
      border: 1px solid var(--line); border-radius: 14px;
      padding: 14px; margin-bottom: 12px; background: #0e1511;
    }
    .report h3 { margin: 0 0 8px; font-size: 16px; color: var(--accent); }
    .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    .grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 14px;
    }
    .grid div span { display: block; color: var(--muted); font-size: 12px; }
    .comment {
      margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
      font-size: 14px; white-space: pre-wrap;
    }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loginView">
      <div class="logo">✦</div>
      <p class="pill">HPF ADMIN</p>
      <h1>Full Reports</h1>
      <p class="sub">Sign in with Admin account to view full report details</p>
      <div class="card">
        <label>Email</label>
        <input id="email" type="email" placeholder="admin@email.com" />
        <label>Password</label>
        <input id="password" type="password" placeholder="Password" />
        <button class="primary" id="loginBtn" type="button">Sign in</button>
        <div class="error" id="errorBox"></div>
      </div>
    </div>

    <div id="listView" class="hidden">
      <div class="logo">✦</div>
      <p class="pill">HPF ADMIN</p>
      <div class="head">
        <h2>All weekly reports</h2>
        <button class="ghost" id="logoutBtn" type="button" style="width:auto;margin:0;">Sign out</button>
      </div>
      <div id="reports"></div>
      <div class="error" id="listError"></div>
      <div class="ok" id="listOk"></div>
    </div>
  </div>
  <script>
    const SUPABASE_URL = "https://pexepaclinlqcwjuzhen.supabase.co";
    const SUPABASE_KEY = "sb_publishable_U7WdBF49bn0x0cJ8t3s2WQ_5w4mnty5";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginView = document.getElementById("loginView");
    const listView = document.getElementById("listView");
    const errorBox = document.getElementById("errorBox");
    const listError = document.getElementById("listError");
    const listOk = document.getElementById("listOk");
    const reportsEl = document.getElementById("reports");

    function show(el, msg) {
      el.textContent = msg || "";
      el.classList.toggle("show", !!msg);
    }

    async function requireAdmin(userId) {
      const { data, error } = await sb
        .from("admin_accounts")
        .select("id")
        .eq("id", userId)
        .maybeSingle();
      if (error) throw error;
      return !!data;
    }

    async function loadReports() {
      show(listError, ""); show(listOk, "");
      reportsEl.innerHTML = "<p class='meta'>Loading...</p>";

      const { data, error } = await sb
        .from("weekly_reports")
        .select("id, week_number, title, duration, attendance, comment, content, created_at, hostels(name), tribes(name), executive_accounts(full_name, email)")
        .order("created_at", { ascending: false });

      if (error) {
        const fallback = await sb
          .from("weekly_reports")
          .select("*")
          .order("created_at", { ascending: false });
        if (fallback.error) {
          reportsEl.innerHTML = "";
          return show(listError, fallback.error.message);
        }
        renderSimple(fallback.data || []);
        return;
      }
      renderFull(data || []);
    }

    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderFull(rows) {
      if (!rows.length) {
        reportsEl.innerHTML = "<p class='meta'>No reports yet.</p>";
        return;
      }
      reportsEl.innerHTML = rows.map(r => {
        const hostel = (r.hostels && r.hostels.name) || "—";
        const tribe = (r.tribes && r.tribes.name) || "—";
        const exec = (r.executive_accounts && (r.executive_accounts.full_name || r.executive_accounts.email)) || "—";
        const when = r.created_at ? new Date(r.created_at).toLocaleString() : "—";
        const body = r.comment || r.content || "—";
        return (
          '<div class="report">' +
          "<h3>" + escapeHtml(r.title || "Untitled report") + "</h3>" +
          '<div class="meta">Week ' + (r.week_number ?? "—") + " · " + escapeHtml(when) + "</div>" +
          '<div class="grid">' +
          "<div><span>Tribe</span><strong>" + escapeHtml(tribe) + "</strong></div>" +
          "<div><span>Hostel</span><strong>" + escapeHtml(hostel) + "</strong></div>" +
          "<div><span>Executive</span><strong>" + escapeHtml(exec) + "</strong></div>" +
          "<div><span>Duration</span><strong>" + escapeHtml(r.duration || "—") + "</strong></div>" +
          "<div><span>Attendance</span><strong>" + (r.attendance ?? "—") + "</strong></div>" +
          "<div><span>Week</span><strong>" + (r.week_number ?? "—") + "</strong></div>" +
          "</div>" +
          '<div class="comment"><span style="color:var(--muted);font-size:12px;">Comment</span><br>' +
          escapeHtml(body) +
          "</div></div>"
        );
      }).join("");
    }

    function renderSimple(rows) {
      if (!rows.length) {
        reportsEl.innerHTML = "<p class='meta'>No reports yet.</p>";
        return;
      }
      reportsEl.innerHTML = rows.map(r => {
        const when = r.created_at ? new Date(r.created_at).toLocaleString() : "—";
        const body = r.comment || r.content || "—";
        return (
          '<div class="report">' +
          "<h3>" + escapeHtml(r.title || "Untitled report") + "</h3>" +
          '<div class="meta">Week ' + (r.week_number ?? "—") + " · " + escapeHtml(when) + "</div>" +
          '<div class="grid">' +
          "<div><span>Duration</span><strong>" + escapeHtml(r.duration || "—") + "</strong></div>" +
          "<div><span>Attendance</span><strong>" + (r.attendance ?? "—") + "</strong></div>" +
          "</div>" +
          '<div class="comment"><span style="color:var(--muted);font-size:12px;">Comment</span><br>' +
          escapeHtml(body) +
          "</div></div>"
        );
      }).join("");
    }

    document.getElementById("loginBtn").onclick = async () => {
      show(errorBox, "");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        const ok = await requireAdmin(data.user.id);
        if (!ok) {
          await sb.auth.signOut();
          throw new Error("This account is not an HPF Admin.");
        }
        loginView.classList.add("hidden");
        listView.classList.remove("hidden");
        await loadReports();
      } catch (err) {
        show(errorBox, err.message || String(err));
      }
    };

    document.getElementById("logoutBtn").onclick = async () => {
      await sb.auth.signOut();
      listView.classList.add("hidden");
      loginView.classList.remove("hidden");
    };

    (async () => {
      const { data } = await sb.auth.getSession();
      if (!data.session) return;
      const ok = await requireAdmin(data.session.user.id);
      if (!ok) return;
      loginView.classList.add("hidden");
      listView.classList.remove("hidden");
      await loadReports();
    })();
  </script>
</body>
</html>
